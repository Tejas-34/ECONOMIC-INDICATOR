name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: economic_indicators
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password_2026!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite in Mock Mode
        run: |
          cd backend
          DATA_MODE=mock pytest -v

      - name: Run Live Contract Tests against Seeded PostgreSQL
        env:
          DATA_MODE: live
          DATABASE_URL: postgresql://postgres:ci_test_password_2026!@localhost:5432/economic_indicators
          JWT_SECRET: ci_jwt_secret_token_at_least_32_characters_long_2026!
          EVAL_PASSWORD: TestAnalystPassword@2026!
          ALLOW_INSECURE_DEFAULTS: "true"
        run: |
          cd backend
          alembic upgrade head
          python scripts/seed_user.py
          pytest tests/test_indicators.py tests/test_auth.py tests/test_security.py -v

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm test

      - name: Build frontend production bundle (Live Default)
        run: |
          cd frontend
          VITE_USE_MOCKS=false npm run build

      - name: Verify mock files and fixtures are excluded from production bundle
        run: |
          cd frontend
          if grep -rn "mock_jwt_token" dist/; then
            echo "ERROR: Mock tokens detected in production bundle!"
            exit 1
          fi
          if find dist/ -name "*mock*.json" | grep -q .; then
            echo "ERROR: Mock JSON files present in production bundle!"
            exit 1
          fi
          echo "Verification passed: No mock fixtures in production bundle."

  openapi-drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install backend requirements & export OpenAPI
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          python scripts/export_openapi.py

      - name: Install frontend dependencies & check schema drift
        run: |
          npm ci
          npm --prefix frontend run gen:api
          git diff --exit-code frontend/src/api/schema.d.ts
