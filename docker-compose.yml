services:
  db:
    image: postgres:16-alpine
    container_name: economic_indicators_db
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-economic_indicators}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # NOTE: NO ports are published here! PostgreSQL is strictly unreachable from outside the Docker network.
    networks:
      - internal_network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d economic_indicators"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: economic_indicators_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATA_MODE: ${DATA_MODE:-live}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/economic_indicators}
      JWT_SECRET: ${JWT_SECRET}
      EVAL_USERNAME: ${EVAL_USERNAME:-analyst@adityabirla.com}
      EVAL_PASSWORD: ${EVAL_PASSWORD}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      ALLOW_INSECURE_DEFAULTS: ${ALLOW_INSECURE_DEFAULTS:-false}
    ports:
      - "8000:8000"
    networks:
      - internal_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  internal_network:
    driver: bridge

volumes:
  pgdata:
