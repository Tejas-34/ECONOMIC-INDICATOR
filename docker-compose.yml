services:
  db:
    image: postgres:16-alpine
    container_name: economic_indicators_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: economic_indicators
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_2026
    # NOTE: NO ports are published here! PostgreSQL is strictly unreachable from outside the Docker network.
    networks:
      - internal_network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d economic_indicators"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: economic_indicators_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_MODE: live
      DATABASE_URL: postgresql://postgres:postgres_secure_password_2026@db:5432/economic_indicators
      JWT_SECRET: c2VjdXJlX2p3dF9zZWNyZXRfa2V5X2Zvcl9lY29ub21pY19pbmRpY2F0b3JfZGFzaGJvYXJkXzIwMjY=
      EVAL_USERNAME: analyst@adityabirla.com
      EVAL_PASSWORD_HASH: $2b$12$e6mO7jJ6g5lWkY8g2k.yquMhT6UfO6b5HjCgV4s9R2E1k3m8t2Y1e
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    networks:
      - internal_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  internal_network:
    driver: bridge

volumes:
  pgdata:
